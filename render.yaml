databases:
  # Persistent Postgres. The free tier self-deletes 30 days after creation, so a
  # durable "project brain" must use a paid plan. Downgrade to `free` only for a
  # throwaway trial you will finish within the month.
  - name: sac-v1-db
    plan: basic-256mb
    databaseName: sac
    user: sac

services:
  - type: web
    name: shared-agent-context
    runtime: python
    # Starter avoids the free tier's 15-minute idle spin-down (a ~1 min cold
    # start would time out the first OAuth/token exchange or sync). Downgrade to
    # `free` if you accept that and pre-warm /health before demos.
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Migrate before serving. scripts/migrate.py handles the pre-Alembic V1
    # database (built by create_all, never stamped) as well as fresh installs,
    # and is a no-op once current.
    preDeployCommand: python scripts/migrate.py
    # --proxy-headers + --forwarded-allow-ips='*' make request.url.scheme https
    # behind Render's TLS proxy, so issuer URLs and Secure cookies are correct.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sac-v1-db
          property: connectionString
      # Pinned, because Render's default moves and this codebase is 3.13-only.
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: SAC_AUTH_MODE
        value: auth
      # RENDER_EXTERNAL_URL is injected automatically and used as the OAuth
      # issuer. SAC_PUBLIC_URL overrides it, and the live deployment sets it to
      # https://withosmos.com. It is not committed because moving the issuer
      # invalidates every connected client, so it should be a deliberate
      # dashboard change rather than something a blueprint apply can flip.
      - key: SAC_PUBLIC_URL
        sync: false
      # localhost is here for MCP clients that complete OAuth against a loopback
      # redirect; the hosted assistants use their own domains above.
      - key: SAC_ALLOWED_REDIRECT_HOSTS
        value: claude.ai,claude.com,chatgpt.com,openai.com,localhost,127.0.0.1
      - key: SAC_CIMD_ALLOWED_HOSTS
        value: chatgpt.com,openai.com
      # Unverified accounts can read and create their own contexts; what this
      # gates is reaching anyone else: accepting an invite, joining by link,
      # inviting by email, and creating an organisation.
      - key: SAC_REQUIRE_VERIFIED_EMAIL
        value: "1"
      # Outbound email. `console` only writes the message to the logs, which
      # silently strands every new user: verification, invites and password
      # resets all become undeliverable while the app reports success. The live
      # deployment sends through Resend from a verified domain, so this declares
      # `resend` and RESEND_API_KEY below is required, not optional.
      - key: SAC_EMAIL_PROVIDER
        value: resend
      - key: SAC_EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Connection pool. app/main.py caps the worker-thread pool to the same
      # total, so the process never accepts more concurrency than the database
      # can serve. pool_size + max_overflow, times instances, plus the retention
      # job, must stay under the Postgres plan's max_connections.
      - key: SAC_DB_POOL_SIZE
        value: "10"
      - key: SAC_DB_MAX_OVERFLOW
        value: "10"
      # Set these in the Render dashboard (sync:false keeps them out of git).
      - key: SAC_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: SAC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Federated sign-in. A provider needs BOTH halves to count as enabled;
      # absent → that button is simply not rendered, which is why a half-set
      # pair fails silently rather than loudly.
      - key: SAC_GOOGLE_CLIENT_ID
        sync: false
      - key: SAC_GOOGLE_CLIENT_SECRET
        sync: false
      - key: SAC_GITHUB_CLIENT_ID
        sync: false
      - key: SAC_GITHUB_CLIENT_SECRET
        sync: false
      # Billing. Absent → the product still runs, entirely on the Free plan, and
      # the billing panel says so rather than erroring. The price ids are not
      # secret but live here so the catalogue cannot drift between modes: a test
      # key with live price ids fails in ways that are tedious to diagnose.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_MONTHLY_PRICE_ID
        sync: false
      - key: STRIPE_PRO_ANNUAL_PRICE_ID
        sync: false
      # Signs CSRF tokens. Without it they are per-process, so a restart makes
      # every open tab reissue one on its next /v1/me.
      - key: SAC_SECRET_KEY
        generateValue: true

  # Data retention. A separate job rather than a thread in the web service: a
  # reaper inside the web process dies with every deploy and would run twice as
  # soon as there are two instances. Here its failures are visible and it cannot
  # slow a request. Idempotent, so a missed run simply catches up.
  #
  # NOTE: this deployment's services were created individually, not from this
  # blueprint, so pushing a new service here does not create it — the reaper was
  # created directly against the Render API to match what is declared below.
  # Keep the two in step by hand until a blueprint is actually applied.
  - type: cron
    name: sac-reaper
    runtime: python
    plan: starter
    schedule: "17 4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/reaper.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sac-v1-db
          property: connectionString
      # Sync records answer "what did the agent know when it said that". Worth
      # 90 days; not worth forever, since each one enumerates a person's private
      # memory. The audit trail is kept indefinitely and never reaped.
      - key: SAC_RETENTION_DAYS_SNAPSHOTS
        value: "90"
      # The job is short-lived and single-threaded; it needs very few.
      - key: SAC_DB_POOL_SIZE
        value: "2"
      - key: SAC_DB_MAX_OVERFLOW
        value: "1"
