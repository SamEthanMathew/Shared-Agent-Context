databases:
  - name: sac-v0-db
    plan: free
    databaseName: sac
    user: sac

services:
  - type: web
    name: shared-agent-context-v0
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sac-v0-db
          property: connectionString
      - key: SAC_PROJECT_ID
        value: sac-v0
