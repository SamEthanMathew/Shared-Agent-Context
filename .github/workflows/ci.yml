name: SAC V0 CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Run Streamable HTTP MCP smoke test
        env:
          PYTHONPATH: .
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8765 > /tmp/sac-uvicorn.log 2>&1 &
          SAC_PID=$!
          trap 'kill $SAC_PID 2>/dev/null || true' EXIT
          python tests/smoke_http_mcp.py || (cat /tmp/sac-uvicorn.log && exit 1)
